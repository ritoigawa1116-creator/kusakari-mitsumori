<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24461f">
<title>現場見積</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: dark-green title band, then two large tap targets (one per job type), stacked on phones and side by side on iPad. */
:root{
  --bg:#eef1ea; --panel:#ffffff; --fg:#1b2318; --muted:#5a6655; --line:#d3dacd;
  --accent:#24461f; --pick:#ffd400; --band:#24461f; --band-fg:#ffffff;
  --font:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",Meiryo,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121610; --panel:#1b2119; --fg:#e8eee3; --muted:#9aa693; --line:#323b2e; --accent:#7fbf6a; --band:#0d140b; --band-fg:#e8eee3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121610; --panel:#1b2119; --fg:#e8eee3; --muted:#9aa693; --line:#323b2e; --accent:#7fbf6a; --band:#0d140b; --band-fg:#e8eee3; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
header{background:var(--band);color:var(--band-fg);padding:calc(28px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 28px max(20px,env(safe-area-inset-left,0px))}
header .in,main{max-width:720px;margin:0 auto}
header h1{margin:0;font-size:26px}
header p{margin:4px 0 0;opacity:.8;font-size:14px}
main{padding-block:24px 40px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;gap:14px}
@media (min-width:640px){main{grid-template-columns:1fr 1fr}}
a.card{display:grid;grid-template-columns:88px 1fr;gap:14px;align-items:center;padding:18px;background:var(--panel);border:2px solid var(--line);border-radius:16px;color:var(--fg);text-decoration:none;min-height:120px}
a.card:hover,a.card:focus-visible{border-color:var(--accent)}
a.card:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
a.card svg{width:88px;height:88px}
a.card .t{font-size:21px;font-weight:700;line-height:1.3}
a.card .d{font-size:13px;color:var(--muted);margin-top:4px}
a.card .go{display:inline-block;margin-top:10px;font-weight:700;color:var(--accent)}
</style>
</head>
<body>
<header><div class="in">
  <h1>現場見積</h1>
  <p>お客様の前で、その場で概算見積を出します</p>
</div></header>
<main>
  <a class="card" href="kusakari/">
    <svg viewBox="0 0 88 88" aria-hidden="true">
      <rect x="2" y="2" width="84" height="84" rx="14" fill="#4f7a3a"/>
      <path d="M16 62 L22 22 L66 16 L72 58 Z" fill="#ffd40055" stroke="#ffd400" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="16" cy="62" r="5" fill="#ffd400" stroke="#fff" stroke-width="2"/><circle cx="22" cy="22" r="5" fill="#ffd400" stroke="#fff" stroke-width="2"/>
      <circle cx="66" cy="16" r="5" fill="#ffd400" stroke="#fff" stroke-width="2"/><circle cx="72" cy="58" r="5" fill="#ffd400" stroke="#fff" stroke-width="2"/>
      <rect x="36" y="32" width="16" height="14" fill="#ff3d6a99" stroke="#ff3d6a" stroke-width="3"/>
    </svg>
    <div><div class="t">草刈り</div><div class="d">航空写真で敷地を囲んで面積を測り、見積を出す</div><span class="go">開く →</span></div>
  </a>
  <a class="card" href="fuyohin/">
    <svg viewBox="0 0 88 88" aria-hidden="true">
      <rect x="2" y="2" width="84" height="84" rx="14" fill="#24461f"/>
      <rect x="12" y="44" width="40" height="14" fill="#ffd400"/>
      <rect x="12" y="34" width="40" height="24" rx="2" fill="none" stroke="#fff" stroke-width="3"/>
      <path d="M55 58 V40 h13 l9 10 v8 z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="24" cy="63" r="6" fill="#24461f" stroke="#fff" stroke-width="3"/><circle cx="66" cy="63" r="6" fill="#24461f" stroke="#fff" stroke-width="3"/>
    </svg>
    <div><div class="t">不用品処分・買取</div><div class="d">軽トラの量と品物を選んで、処分費と買取額を出す</div><span class="go">開く →</span></div>
  </a>
</main>
</body>
</html>
